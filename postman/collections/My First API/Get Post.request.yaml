$kind: http-request
method: GET
url: 'https://jsonplaceholder.typicode.com/posts/1'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ✅ Test 1: Check the status code is 200 (OK)
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // ✅ Test 2: Check the response time is acceptable
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // ✅ Test 3: Check the response is valid JSON
      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      // ✅ Test 4: Check the response body has expected fields
      pm.test("Response has expected fields", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("title");
          pm.expect(jsonData).to.have.property("body");
          pm.expect(jsonData).to.have.property("userId");
      });

      // ✅ Test 5: Check the data types of the fields
      pm.test("Fields have correct data types", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.id).to.be.a("number");
          pm.expect(jsonData.title).to.be.a("string");
          pm.expect(jsonData.userId).to.be.a("number");
      });
