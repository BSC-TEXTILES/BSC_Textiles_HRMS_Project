$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/selling-points'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '20'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns valid JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response is an object", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an('object');
          const points = json.sellingPoints || json.data || json;
          if (Array.isArray(points) && points.length > 0) {
              pm.environment.set('selling_point_id', points[0].id);
          }
      });
