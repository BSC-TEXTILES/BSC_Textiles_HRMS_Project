$kind: collection
name: BSC Textiles HRMS API
description: |-
  Complete API collection for BSC Textiles HRMS.
  Base URL: {{base_url}} (default: http://localhost:4000/api/v1)
  
  Usage:
  1. Select the "BSC HRMS - Local" environment
  2. Run "Auth > Login" first to get a token (auto-saved)
  3. All other requests use {{token}} automatically via Bearer auth
variables:
  - key: base_url
    value: 'http://localhost:4000/api/v1'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
