$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/reports'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time under 5s", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
