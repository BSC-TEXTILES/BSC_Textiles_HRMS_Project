$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/employees'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '20'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time under 3s", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Returns employees array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("employees");
          pm.expect(json.employees).to.be.an("array");
      });
      pm.test("Has pagination fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("total");
          pm.expect(json).to.have.property("page");
          pm.expect(json).to.have.property("limit");
      });
      // Save first employee ID for use in other requests
      const json = pm.response.json();
      if (json.employees && json.employees.length > 0) {
          pm.environment.set("employee_id", json.employees[0].id);
      }
