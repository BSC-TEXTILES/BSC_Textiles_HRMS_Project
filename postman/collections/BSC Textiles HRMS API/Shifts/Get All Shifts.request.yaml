$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/shifts'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns shifts array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("shifts");
          pm.expect(json.shifts).to.be.an("array");
      });
      const json = pm.response.json();
      if (json.shifts && json.shifts.length > 0) {
          pm.environment.set("shift_id", json.shifts[0].id);
      }
