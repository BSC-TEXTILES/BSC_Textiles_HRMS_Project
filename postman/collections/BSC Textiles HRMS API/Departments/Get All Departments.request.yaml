$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/departments'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns departments array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("departments");
          pm.expect(json.departments).to.be.an("array");
      });
      const json = pm.response.json();
      if (json.departments && json.departments.length > 0) {
          pm.environment.set("department_id", json.departments[0].id);
      }
