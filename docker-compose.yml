# ==============================================================================
# BSC TEXTILES HRMS — production topology
#
#   internet ──▶ proxy (80/443 only) ──▶ web  (Next.js, :3000)
#                                    └──▶ api  (Express,  :4000)
#   api/worker ──▶ db    (MySQL 8,   no published port)
#              └──▶ cache (Redis 7,  no published port)
#
# Two networks. `edge` carries proxy↔app traffic. `services` is
# `internal: true`: the database and the cache have no route to the host stack
# or the internet, and only 80/443 are published — there is nothing on :3306
# or :6379 to connect to, which is the point.
#
# Bring up:
#   cp .env.example .env       # then fill in every value marked :? (required)
#   docker compose build
#   docker compose up -d
#
# TLS material is expected on the host before the first `up`:
#   infra/nginx/tls/{fullchain.pem,privkey.pem}   (see SECURITY.md, certbot)
#
# `version:` is obsolete in Compose v2 and prints a warning; omitted on purpose.
# ==============================================================================

x-hardening: &hardening
  # Nothing gets a capability it does not need. Dropping ALL and then adding
  # back only what a specific service requires is stricter than the default
  # capability set, which includes SETUID/MODIFY_KERNEL-ish power no web app
  # should hold.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  tmpfs:
    - /tmp:mode=1777,size=64m,noexec
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: Asia/Kolkata
  DB_TYPE: mysql

  # --- data -----------------------------------------------------------------
  DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
  DATABASE_URL_HQ: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}

  # --- shared store ---------------------------------------------------------
  # Full URL including the password, because ioredis takes one string:
  #   redis://:password@cache:6379/0     (plaintext, internal network)
  #   rediss://:password@cache:6379/0    (TLS — set REDIS_TLS=true as well)
  REDIS_URL: ${REDIS_URL:?redis://:<password>@cache:6379/0}
  REDIS_TLS: ${REDIS_TLS:-false}
  # Required by default: without Redis the lockout counters, rate limits and
  # token revocation list live in one process's memory, which is not a
  # security control. Fail closed rather than degrade silently.
  REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-bsc:}

  # --- login protection -----------------------------------------------------
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
  LOCKOUT_SECONDS: ${LOCKOUT_SECONDS:-180}
  CAPTCHA_AFTER_ATTEMPTS: ${CAPTCHA_AFTER_ATTEMPTS:-2}
  ALERT_AFTER_LOCKOUTS: ${ALERT_AFTER_LOCKOUTS:-2}
  IMPOSSIBLE_TRAVEL_WINDOW_MINUTES: ${IMPOSSIBLE_TRAVEL_WINDOW_MINUTES:-15}
  LOGIN_MIN_RESPONSE_MS: ${LOGIN_MIN_RESPONSE_MS:-350}
  ESCALATE_AFTER_LOCKOUTS: ${ESCALATE_AFTER_LOCKOUTS:-0}
  # Extending a cooldown to the whole source IP would lock out every member of a
  # showroom that shares one NAT line. Off by default; see SECURITY.md section 6.
  LOCKOUT_PER_IP: ${LOCKOUT_PER_IP:-false}
  # Both must stay false: self-service registration and an anonymous
  # "forgot password" endpoint are the two ways back into a credential store
  # that this deployment deliberately closed.
  ALLOW_SELF_REGISTRATION: "false"
  ALLOW_PUBLIC_PASSWORD_RESET: "false"

  # --- rate limiting --------------------------------------------------------
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
  RATE_LIMIT_SENSITIVE: ${RATE_LIMIT_SENSITIVE:-5}
  RATE_LIMIT_SENSITIVE_WINDOW: ${RATE_LIMIT_SENSITIVE_WINDOW:-60}
  RATE_LIMIT_AUTOBLOCK_SECONDS: ${RATE_LIMIT_AUTOBLOCK_SECONDS:-900}
  RATE_LIMIT_AUTOBLOCK_TRIPS: ${RATE_LIMIT_AUTOBLOCK_TRIPS:-5}

  # --- tokens ---------------------------------------------------------------
  JWT_ALGORITHM: ${JWT_ALGORITHM:-ES256}
  JWT_ISSUER: ${JWT_ISSUER:-bsc-textiles-hrms}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-bsc-textiles-hrms-web}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
  JWT_KEY_ROTATION_DAYS: ${JWT_KEY_ROTATION_DAYS:-90}
  JWT_KEY_GRACE: ${JWT_KEY_GRACE:-24h}
  # Wraps the ES256 private keys stored in the signing_keys table.
  TOKEN_KEY_ENCRYPTION_KEY: ${TOKEN_KEY_ENCRYPTION_KEY:?openssl rand -hex 32}

  # --- sessions -------------------------------------------------------------
  IDLE_TIMEOUT: ${IDLE_TIMEOUT:-15m}
  ABSOLUTE_TIMEOUT: ${ABSOLUTE_TIMEOUT:-8h}
  SESSION_WARNING_SECONDS: ${SESSION_WARNING_SECONDS:-60}
  SINGLE_ACTIVE_SESSION: ${SINGLE_ACTIVE_SESSION:-false}
  MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-3}

  # --- passwords ------------------------------------------------------------
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
  PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
  PASSWORD_EXPIRY_DAYS: ${PASSWORD_EXPIRY_DAYS:-90}
  # Mixed into every hash before Argon2id. Losing it does not expose passwords
  # but regenerating it invalidates all of them, so back it up with the vault.
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?openssl rand -base64 48}
  PASSWORD_CHECK_BREACHED: ${PASSWORD_CHECK_BREACHED:-true}

  # --- transport ------------------------------------------------------------
  # Exactly one hop (the proxy). Setting this higher than the real chain lets a
  # client append its own X-Forwarded-For entry and choose which IP we limit.
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  REQUIRE_HTTPS: "true"
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-strict}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  STRICT_CSP: ${STRICT_CSP:-true}
  HSTS_HEADER: ${HSTS_HEADER:-max-age=63072000; includeSubDomains; preload}
  CORS_ALLOWLIST: ${CORS_ALLOWLIST:?comma-separated exact origins, no wildcards}
  FRONTEND_URL: ${FRONTEND_URL:-https://hrms.bsctextiles.com}

  # --- alerts, MFA, privacy -------------------------------------------------
  SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL:-}
  SECURITY_WEBHOOK_URL: ${SECURITY_WEBHOOK_URL:-}
  MFA_REQUIRED_FOR_PRIVILEGED: ${MFA_REQUIRED_FOR_PRIVILEGED:-true}
  TOTP_ISSUER: ${TOTP_ISSUER:-BSC Textiles HRMS}
  CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-2026-10}
  RETENTION_AUDIT_LOG_DAYS: ${RETENTION_AUDIT_LOG_DAYS:-730}
  RETENTION_LOGIN_ATTEMPT_DAYS: ${RETENTION_LOGIN_ATTEMPT_DAYS:-180}
  RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-90}
  RETENTION_PURGE_INTERVAL_HOURS: ${RETENTION_PURGE_INTERVAL_HOURS:-24}

  # --- paths (read-only rootfs: these are the only writable locations) ------
  UPLOAD_DIR: /app/uploads
  QUARANTINE_DIR: /app/quarantine
  WORKER_LOG_DIR: /app/logs
  BIOMETRIC_LOG_DIR: /app/logs

  # --- biometrics -----------------------------------------------------------
  BIOMETRIC_CONNECTOR_KEY: ${BIOMETRIC_CONNECTOR_KEY:?shared secret for the showroom edge connector}
  BIOMETRIC_TERMINAL_PORT: ${BIOMETRIC_TERMINAL_PORT:-4370}
  BIOMETRIC_POLL_INTERVAL_MS: ${BIOMETRIC_POLL_INTERVAL_MS:-2500}
  BIOMETRIC_DEFAULT_TIMEZONE: ${BIOMETRIC_DEFAULT_TIMEZONE:-Asia/Kolkata}
  HIRING_ENCRYPTION_KEY: ${HIRING_ENCRYPTION_KEY:?openssl rand -base64 32 — candidate PII is sealed with a key derived from this}

  # --- mail -----------------------------------------------------------------
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-security@bsctextiles.com}

services:
  # --------------------------------------------------------------------------
  # Edge reverse proxy — the only published ports in this file. TLS terminates
  # here; HTTP 308s to HTTPS and every response carries the security header
  # set (infra/nginx/snippets/security-headers.conf).
  #
  # The master process stays root only long enough to bind 80/443 and then
  # drops workers to the `nginx` user via `user nginx;` in nginx.conf.
  # cap_drop ALL removes the right to bind <1024, so NET_BIND_SERVICE is the
  # one capability added back; the rest are what the image's entrypoint and
  # log rotation need.
  # --------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: bsc-hrms-proxy
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    read_only: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ${TLS_DIR:-./infra/nginx/tls}:/etc/nginx/tls:ro
      - certbot_www:/var/www/certbot:ro
    tmpfs:
      - /tmp:mode=1777,size=64m,noexec
      - /var/run/nginx:mode=1777,size=16m,noexec
      - /var/cache/nginx:mode=1777,size=256m,noexec
      - /var/log/nginx:mode=1777,size=256m,noexec
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # Next.js app server. It reaches the API through the /api rewrite in
  # next.config.ts, so the browser only ever sees one origin and the HttpOnly
  # session cookies stay first-party — never sent to a second host, never in
  # localStorage.
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it
        # must be a build argument — setting it at runtime changes nothing.
        # "/api" keeps the session cookies on the app origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        # Empty means "same origin as the page", which the proxy serves at
        # /socket.io/. Only set this if sockets live on another host.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: bsc-hrms-web:latest
    container_name: bsc-hrms-web
    <<: *hardening
    read_only: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://api:4000
      API_URL: http://api:4000
      NEXTAUTH_URL: ${NEXTAUTH_URL:?the exact public origin, e.g. https://hrms.bsctextiles.com}
      # next-auth's cookie is a UI identity marker, not a credential, but a
      # guessable secret lets anyone forge a session object.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?openssl rand -base64 32}
      TZ: Asia/Kolkata
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------------------------
  # Express API. On both networks: it is the only thing the proxy forwards
  # /api to, and the only thing allowed to reach the database and the cache.
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: bsc-hrms-api:latest
    container_name: bsc-hrms-api
    <<: *hardening
    # Root filesystem frozen; the only writes are logs, uploads and quarantine,
    # each on its own named volume, plus /tmp (noexec).
    read_only: true
    environment:
      <<: *api-env
      PORT: "4000"
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/uploads
      - quarantine_data:/app/storage/quarantine
      - api_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - edge
      - services
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # Biometric polling / back-fill worker. Same code, dev-capable image, because
  # it runs TypeScript entrypoints the runtime image no longer contains.
  #
  # Off by default (profile "poll"): the showrooms push over /iclock, so only
  # installments still on polled ZK need this. Enable with
  #   docker compose --profile poll up -d worker
  # --------------------------------------------------------------------------
  worker:
    image: bsc-hrms-api-tools:latest
    container_name: bsc-hrms-worker
    profiles: ["poll"]
    <<: *hardening
    entrypoint: ["npx", "tsx", "src/workers/superviseWorker.ts"]
    working_dir: /app/backend
    environment:
      <<: *api-env
      WORKER_AUTORESTART: "true"
    volumes:
      - uploads_data:/app/uploads
      - api_logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - services

  # --------------------------------------------------------------------------
  # One-shot schema migrator. Additive only: it applies database/migrations in
  # order and records them in _migrations; it never drops or truncates. Not
  # read-only because tsx writes a transpile cache under /app/node_modules.
  # --------------------------------------------------------------------------
  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    image: bsc-hrms-api-tools:latest
    container_name: bsc-hrms-migrator
    <<: *hardening
    entrypoint: ["npx", "tsx", "../database/scripts/migrate.ts"]
    working_dir: /app/backend
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      TZ: Asia/Kolkata
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - services
    restart: "no"

  # --------------------------------------------------------------------------
  # One-off shard provisioner (see docker-compose.shards.yml for the topology):
  #   docker compose --profile provision run --rm shard-provisioner
  # --------------------------------------------------------------------------
  shard-provisioner:
    image: bsc-hrms-api-tools:latest
    container_name: bsc-hrms-shard-provisioner
    profiles: ["provision"]
    <<: *hardening
    entrypoint: ["sh", "-c", "npx tsx src/scripts/provisionShards.ts && npx tsx src/scripts/provisionHiringShards.ts"]
    working_dir: /app/backend
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      TZ: Asia/Kolkata
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
      DATABASE_URL_HQ: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - services
    restart: "no"

  # --------------------------------------------------------------------------
  # Redis — sessions, lockout counters, rate limits, JWT revocation list and
  # the role-permission cache. No published port; internal network only.
  #
  # The image's own USER directive (redis, unprivileged) is what runs here.
  # --------------------------------------------------------------------------
  cache:
    image: redis:7.4-alpine
    container_name: bsc-hrms-cache
    <<: *hardening
    read_only: true
    # No requirepass line in redis.conf: Redis cannot expand environment
    # variables there, so a literal placeholder would silently BECOME the
    # production credential. Compose supplies it, and refuses to start without
    # one.
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?a long random password; never reuse another secret}
    environment:
      # Read by redis-cli for the healthcheck. Visible in `docker inspect`,
      # which is the same trust boundary as the .env file itself.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # Mount only once TLS is enabled in redis.conf; an empty directory is
      # harmless while the block stays commented.
      - ${REDIS_TLS_DIR:-./infra/redis/tls}:/usr/local/etc/redis/tls:ro
      - redis_data:/data
    tmpfs:
      - /tmp:mode=1777,size=32m,noexec
    expose:
      - "6379"
    networks:
      - services
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # MySQL 8 — private network, no host port.
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: bsc-hrms-db
    <<: *hardening
    read_only: true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bsc_textiles_hrms}
      # Least-privilege application account: the API has no DDL rights, so an
      # SQL injection cannot ALTER or DROP. Migrations run as a separate,
      # short-lived credential (the migrator service), not as this user.
      MYSQL_USER: ${MYSQL_USER:-bsc_hrms_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      TZ: Asia/Kolkata
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --bind-address=0.0.0.0
      - --local-infile=0
      - --skip-show-database
      - --log-error=/var/log/mysql/error.log
      # KNOWN GAP, deliberately not closed here. mysql2 is created without an
      # `ssl` option (backend/src/nativeDb.ts), so requiring secure transport
      # server-side would refuse every application connection and the stack
      # would not boot. The compensating control is real: 3306 is not published
      # and `services` is internal, so only the API container can reach it.
      # To close it: add ssl:{ca,rejectUnauthorized} to the pool and flip this
      # to ON — see SECURITY.md, "Database transport".
      - --require-secure-transport=OFF
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    tmpfs:
      - /tmp:mode=1777,size=128m
      - /var/run/mysqld:mode=1777,size=32m
      - /var/log/mysql:mode=1777,size=64m,noexec
    expose:
      - "3306"
    networks:
      - services
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  db_data:
  redis_data:
  certbot_www:
  # Employee photos and documents: a named volume, never the image filesystem,
  # and served through an authenticated API route rather than a public web root.
  uploads_data:
  quarantine_data:
  api_logs:

networks:
  edge:
    driver: bridge
  services:
    driver: bridge
    # No internet egress and no host interface: nothing outside this compose
    # project can open a socket to the database or the cache.
    internal: true
