# ==============================================================================
# BSC TEXTILES HRMS — SHARDED DEPLOYMENT TOPOLOGY
#
# Control database + one operational shard database per showroom:
#   bsc_textiles_hrms   (control: users, roles, RBAC, org, audit, credentials)
#   bsc_shard_bel       (Belagavi operational shard)
#   bsc_shard_dav       (Davanagere operational shard)
#   bsc_shard_shi       (Shivamogga operational shard)
#
# This file is the same hardened topology as docker-compose.yml — one proxy with
# published ports, internal service network, non-root read-only containers —
# with the shard databases created on first boot and their schemas provisioned
# by a one-off service:
#
#   docker compose -f docker-compose.shards.yml up -d --build
#   docker compose -f docker-compose.shards.yml --profile provision run --rm shard-provisioner
#
# Service names must stay `api` and `web`: infra/nginx/nginx.conf proxies to
# those DNS names. Renaming them here leaves the proxy pointing at a host that
# does not exist.
# ==============================================================================

x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  tmpfs:
    - /tmp:mode=1777,size=64m,noexec
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: Asia/Kolkata
  DB_TYPE: mysql
  DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
  DATABASE_URL_HQ: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
  DATABASE_URL_BEL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/bsc_shard_bel
  DATABASE_URL_DAV: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/bsc_shard_dav
  DATABASE_URL_SHI: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/bsc_shard_shi
  REDIS_URL: ${REDIS_URL:?redis://:<password>@cache:6379/0}
  REDIS_TLS: ${REDIS_TLS:-false}
  REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-bsc:}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
  LOCKOUT_SECONDS: ${LOCKOUT_SECONDS:-180}
  RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
  RATE_LIMIT_SENSITIVE: ${RATE_LIMIT_SENSITIVE:-5}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
  IDLE_TIMEOUT: ${IDLE_TIMEOUT:-15m}
  ABSOLUTE_TIMEOUT: ${ABSOLUTE_TIMEOUT:-8h}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-ES256}
  JWT_ISSUER: ${JWT_ISSUER:-bsc-textiles-hrms}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-bsc-textiles-hrms-web}
  TOKEN_KEY_ENCRYPTION_KEY: ${TOKEN_KEY_ENCRYPTION_KEY:?openssl rand -hex 32}
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?openssl rand -base64 48}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
  PASSWORD_EXPIRY_DAYS: ${PASSWORD_EXPIRY_DAYS:-90}
  ALLOW_SELF_REGISTRATION: "false"
  ALLOW_PUBLIC_PASSWORD_RESET: "false"
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  REQUIRE_HTTPS: "true"
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-strict}
  CORS_ALLOWLIST: ${CORS_ALLOWLIST:?comma-separated exact origins}
  FRONTEND_URL: ${FRONTEND_URL:-https://hrms.bsctextiles.com}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
  SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL:-}
  SECURITY_WEBHOOK_URL: ${SECURITY_WEBHOOK_URL:-}
  MFA_REQUIRED_FOR_PRIVILEGED: ${MFA_REQUIRED_FOR_PRIVILEGED:-true}
  UPLOAD_DIR: /app/uploads
  BIOMETRIC_LOG_DIR: /app/logs   # WORKER_LOG_DIR and QUARANTINE_DIR are not read by any code
  BIOMETRIC_CONNECTOR_KEY: ${BIOMETRIC_CONNECTOR_KEY:?shared secret for the edge connector}
  HIRING_ENCRYPTION_KEY: ${HIRING_ENCRYPTION_KEY:?openssl rand -base64 32}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-security@bsctextiles.com}

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: bsc-hrms-proxy
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    read_only: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ${TLS_DIR:-./infra/nginx/tls}:/etc/nginx/tls:ro
      - certbot_www:/var/www/certbot:ro
    tmpfs:
      - /tmp:mode=1777,size=64m,noexec
      - /var/run/nginx:mode=1777,size=16m,noexec
      - /var/cache/nginx:mode=1777,size=256m,noexec
      - /var/log/nginx:mode=1777,size=256m,noexec
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: bsc-hrms-web:latest
    container_name: bsc-hrms-web
    <<: *hardening
    read_only: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://api:4000
      API_URL: http://api:4000
      NEXTAUTH_URL: ${NEXTAUTH_URL:?the exact public origin}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?openssl rand -base64 32}
      TZ: Asia/Kolkata
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: bsc-hrms-api:latest
    container_name: bsc-hrms-api
    <<: *hardening
    read_only: true
    environment:
      <<: *api-env
      PORT: "4000"
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/uploads
      - quarantine_data:/app/storage/quarantine
      - api_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - edge
      - services
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    image: bsc-hrms-api-tools:latest
    container_name: bsc-hrms-migrator
    <<: *hardening
    entrypoint: ["npx", "tsx", "../database/scripts/migrate.ts"]
    working_dir: /app/backend
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      TZ: Asia/Kolkata
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:-bsc_textiles_hrms}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - services
    restart: "no"

  # Creates the shard schemas and registers each shard in the control
  # database's database_shards table. Idempotent — safe to re-run.
  shard-provisioner:
    image: bsc-hrms-api-tools:latest
    container_name: bsc-hrms-shard-provisioner
    profiles: ["provision"]
    <<: *hardening
    entrypoint: ["sh", "-c", "npx tsx src/scripts/provisionShards.ts && npx tsx src/scripts/provisionHiringShards.ts"]
    working_dir: /app/backend
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - services
    restart: "no"

  worker:
    image: bsc-hrms-api-tools:latest
    container_name: bsc-hrms-worker
    profiles: ["poll"]
    <<: *hardening
    entrypoint: ["npx", "tsx", "src/workers/superviseWorker.ts"]
    working_dir: /app/backend
    environment:
      <<: *api-env
      WORKER_AUTORESTART: "true"
    volumes:
      - uploads_data:/app/uploads
      - api_logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - services

  cache:
    image: redis:7.4-alpine
    container_name: bsc-hrms-cache
    <<: *hardening
    read_only: true
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?a long random password}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ${REDIS_TLS_DIR:-./infra/redis/tls}:/usr/local/etc/redis/tls:ro
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - services
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Control database plus every operational shard in one server. The shard
  # databases themselves are created by the init script mounted below; only the
  # control schema/seed scripts run automatically, because a shard must be
  # provisioned deliberately (the provisioner service), not by a restart.
  db:
    image: mysql:8.0
    container_name: bsc-hrms-db
    <<: *hardening
    read_only: true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bsc_textiles_hrms}
      MYSQL_USER: ${MYSQL_USER:-bsc_hrms_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      TZ: Asia/Kolkata
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=300
      - --bind-address=0.0.0.0
      - --local-infile=0
      - --skip-show-database
      - --log-error=/var/log/mysql/error.log
      # See docker-compose.yml: the mysql2 pool has no ssl option yet, so ON
      # here would refuse every application connection.
      - --require-secure-transport=OFF
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ./database/shards/00_create_shard_databases.sql:/docker-entrypoint-initdb.d/02_shard_databases.sql:ro
    tmpfs:
      - /tmp:mode=1777,size=128m
      - /var/run/mysqld:mode=1777,size=32m
      - /var/log/mysql:mode=1777,size=64m,noexec
    expose:
      - "3306"
    networks:
      - services
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  db_data:
  redis_data:
  certbot_www:
  uploads_data:
  quarantine_data:
  api_logs:

networks:
  edge:
    driver: bridge
  services:
    driver: bridge
    internal: true
