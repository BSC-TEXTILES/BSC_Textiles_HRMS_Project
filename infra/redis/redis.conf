# ===========================================================================
# BSC Textiles HRMS — Redis configuration
#
# What lives in here: rate-limit counters, login-attempt counters and cooldown
# keys, the JWT revocation list, server-side session records and the
# role-permission cache. Nothing else — no employee records, no attendance, no
# biometric templates. Personal and biometric data does not belong in a cache.
#
# The container publishes NO port to the host. It is reachable only from the
# internal compose network that the API is also attached to.
# ===========================================================================

# --- Network --------------------------------------------------------------
# Docker gives this container one address on a private network; binding to
# 127.0.0.1 would make the API unable to reach it. The publish path is closed
# by compose (no ports:, network internal: true), not by this file.
bind 0.0.0.0
protected-mode yes
port 6379

# --- TLS ------------------------------------------------------------------
# REQUIRED in production: the session records and the revocation list are
# credential material, and "internal network" is a mitigation, not encryption.
#
# Left commented because Redis exits immediately if a named certificate file
# is missing, and an operator who has not issued certs yet would get a
# container that will not start. To enable:
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#     -keyout infra/redis/tls/ca.key -out infra/redis/tls/ca.crt \
#     -subj "/CN=BSC HRMS Redis CA"
#   # then a server cert whose CN/SAN matches the compose service name "cache"
#
# and uncomment the four lines below, switch `port` to 0, and set
# REDIS_URL=rediss://...&REDIS_TLS=true. redis-cli healthchecks then need
# --tls plus the same three files.
#
# tls-port 6379
# port 0
# tls-cert-file /usr/local/etc/redis/tls/redis.crt
# tls-key-file  /usr/local/etc/redis/tls/redis.key
# tls-ca-cert-file /usr/local/etc/redis/tls/ca.crt
# tls-auth-clients yes
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-prefer-server-ciphers yes

# --- Authentication -------------------------------------------------------
# No `requirepass` line here on purpose: Redis does not expand environment
# variables in this file, so a literal placeholder password would silently
# become the production credential — a fail-open default. Compose passes
# --requirepass from ${REDIS_PASSWORD} and refuses to start when it is unset.

# Dangerous commands are removed rather than left to ACLs: a compromised API
# process must not be able to wipe the revocation list or the lockout counters.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_bsc_internal_only"
rename-command SHUTDOWN "SHUTDOWN_bsc_internal_only"

# --- Memory ---------------------------------------------------------------
# noeviction is deliberate. Under allkeys-lru, Redis can quietly drop a
# login-attempt counter or a revoked refresh token when memory fills up: the
# lockout resets for an account that is being brute-forced, and a stolen token
# becomes valid again. Failing writes loudly is the safer mode — the API treats
# a Redis write error as a security event and surfaces it on /api/health.
# Size maxmemory above the working set and alert on `evicted_keys`.
maxmemory 256mb
maxmemory-policy noeviction

# --- Durability -----------------------------------------------------------
# The revocation list and session records must survive a restart, otherwise a
# reboot silently re-validates every session that was logged out.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save ""

# --- Limits ---------------------------------------------------------------
timeout 300
tcp-keepalive 60
maxclients 512
client-output-buffer-limit replica 64mb 32mb 60

# --- Logging --------------------------------------------------------------
loglevel notice
logfile ""

# --- Integrity ------------------------------------------------------------
rdbchecksum yes
