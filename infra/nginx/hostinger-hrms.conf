# ==============================================================================
# BSC Textiles HRMS — Hostinger VPS Nginx Site Configuration
# Place in: /etc/nginx/sites-available/bsc-hrms
# Enable:   ln -s /etc/nginx/sites-available/bsc-hrms /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx
# ==============================================================================

# Upstream definitions for local PM2 processes
upstream bsc_frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream bsc_backend_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

# HTTP — Redirect all web traffic to HTTPS; Allow HTTP for eSSL MB160 terminals if firmware lacks SSL
server {
    listen 80;
    listen [::]:80;
    server_name hrms.bsctextiles.com; # Replace with your actual domain

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # eSSL MB160 ADMS Plain HTTP fallback (for terminals whose firmware does not support HTTPS)
    location /iclock {
        client_max_body_size 16M;
        proxy_pass http://bsc_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Redirect all other browser traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main Enterprise Production Site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.bsctextiles.com; # Replace with your actual domain

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hrms.bsctextiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.bsctextiles.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # eSSL MB160 ADMS Push Receiver (HTTPS)
    location /iclock {
        client_max_body_size 16M;
        proxy_pass http://bsc_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # API Endpoints
    location /api/ {
        client_max_body_size 25M;
        proxy_pass http://bsc_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO Real-Time Updates
    location /socket.io/ {
        proxy_pass http://bsc_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploads (Attendance photos & KYC files)
    location /uploads/ {
        proxy_pass http://bsc_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "private, max-age=3600, no-transform" always;
    }

    # Next.js Static Optimization
    location /_next/static/ {
        proxy_pass http://bsc_frontend_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Frontend Application (Next.js SSR & Client routes)
    location / {
        proxy_pass http://bsc_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
