# ===========================================================================
# Security response headers — included per location, not once at http level.
#
# nginx inheritance rule: add_header directives are inherited from the parent
# level only if the current level declares NO add_header of its own. Half of
# the locations in nginx.conf set Cache-Control, so a single http-level block
# would have stripped nosniff, HSTS and X-Frame-Options off /api/, /uploads/
# and every static asset. Including this file in each location is what makes
# the posture actually apply.
# ===========================================================================

# The upstreams set these headers too (backend/src/middleware/securityHeaders.ts
# and frontend/next.config.ts), because `npm run dev` reaches them directly.
# add_header APPENDS a second copy rather than replacing, and two values for one
# header is where inconsistencies go to hide: two HSTS lines with different
# max-ages, a permissive and a restrictive X-Frame-Options competing. Hiding the
# upstream copy and emitting one authoritative value is what makes this
# deterministic.
#
# Content-Security-Policy is deliberately NOT hidden — the API and the app emit
# different policies for different content types, and only they know which.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Powered-By;

# Prevents a browser from rendering an uploaded file as a script or HTML page,
# which is the payoff for accepting document uploads at all.
add_header X-Content-Type-Options "nosniff" always;

# SAMEORIGIN, not DENY: the employee-documents viewer embeds
# /api/employees/documents/:id/preview — the API's own PDF, same origin — in an
# iframe. DENY blanks it. Cross-origin framing is still refused, which is the
# only thing clickjacking actually needs.
add_header X-Frame-Options "SAMEORIGIN" always;

# The full URL is kept for same-origin navigation and dropped on the wire to
# another host, so a session-bearing URL never leaks into a third party's logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The biometric module is the only thing that legitimately needs the camera
# (enrolment and attendance selfies) and geolocation (showroom check-in).
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;

# 2 years + preload + subdomains. Once submitted to the preload list there is
# no returning to plain HTTP, which is the point.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# COOP keeps our window from being scripting-linked by an embedder.
# COEP is deliberately NOT set: the interface loads the Material Symbols icon
# font from Google, which sends no CORP header, so require-corp would blank
# every icon in the product. Self-host that font, then add:
#   add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Origin-Agent-Cluster "?1" always;

# Echoed so a user-reported incident can be pinned to one nginx access-log line
# and one API log record.
add_header X-Request-Id $request_id always;
