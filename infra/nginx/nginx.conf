# ===========================================================================
# BSC Textiles HRMS — edge reverse proxy
#
# This is the only container with a published port. The Next.js app, the
# Express API, Redis and MySQL are unreachable from outside the compose
# network, so there is no "backend host:4000" to scan and no database to
# brute force.
#
# Everything below assumes TLS terminates here and the application trusts
# exactly one proxy hop (TRUST_PROXY_HOPS=1) to recover the real client IP.
# ===========================================================================

worker_processes auto;

# The master binds 80/443 (the only capability compose leaves it,
# NET_BIND_SERVICE) and then hands connections to workers running as this
# unprivileged user. Without this line a root-started master keeps every
# worker root as well.
user nginx;

# Writable paths are tmpfs mounts in docker-compose.yml; the container's
# root filesystem is read-only.
pid /var/run/nginx/nginx.pid;

# The version is withheld from error pages and the Server header.
server_tokens off;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # -------------------------------------------------------------------------
  # Real client IP — only from the networks we actually control.
  # Without this restriction any client could send X-Forwarded-For and pick
  # the address our rate limiter and lockouts key on.
  # -------------------------------------------------------------------------
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # -------------------------------------------------------------------------
  # Logging: structured, with the request id the application also logs, so a
  # line in access.log can be traced to the API's own record.
  # -------------------------------------------------------------------------
  log_format hrms escape=json
    '{"ts":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"body_bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time","http_user_agent":"$http_user_agent",'
    '"request_id":"$request_id","host":"$host"}';

  access_log /var/log/nginx/access.log hrms;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;

  # Request size limits: the biometric terminal pushes face snapshots, which is
  # why the API route allows 12 MB; everything else stays small.
  client_max_body_size 12m;
  client_body_buffer_size 128k;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  # Slowloris resistance and concurrency ceilings.
  limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
  limit_req_zone $binary_remote_addr zone=perip_general:20m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=perip_auth:10m rate=5r/m;

  # The application returns 429 with Retry-After itself; the proxy must agree,
  # because nginx rejects with 503 by default and clients retry a 503 forever.
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml+rss image/svg+xml font/woff2;

  # Brotli is faster but the directive only exists in builds compiled with
  # ngx_brotli. Left commented rather than conditional: an unknown directive
  # here makes nginx refuse to start on the stock image, which is the worse
  # failure. If you build on nginx:alpine-brotli, uncomment:
  #   brotli on;
  #   brotli_comp_level 6;
  #   brotli_min_length 1024;
  #   brotli_types text/plain text/css application/json application/javascript image/svg+xml;

  # -------------------------------------------------------------------------
  # Upstreams. Docker's embedded DNS resolves these on the internal network
  # only; neither has a published port.
  # -------------------------------------------------------------------------
  upstream hrms_web {
    server web:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  upstream hrms_api {
    server api:4000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # -------------------------------------------------------------------------
  # Security headers live in snippets/security-headers.conf and are included
  # per location, NOT set once at http level. nginx drops inherited
  # add_header directives as soon as a lower level declares any add_header of
  # its own — and several locations below set Cache-Control. Declaring them
  # once at http level would therefore have silently removed nosniff, HSTS and
  # X-Frame-Options from /api/, /uploads/ and every static asset.
  #
  # The Content-Security-Policy is emitted by the Next.js middleware
  # (`src/middleware.ts`), not here, because a strict script-src needs a
  # per-request nonce and only the framework can inject it into its own
  # bootstrap script tags. nginx deliberately does not set a second CSP — two
  # policies intersect, and the result silently breaks the app.
  # -------------------------------------------------------------------------

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenges must stay on plain HTTP for http-01 validation.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    # Nothing else on 80. Terminals that cannot do TLS are reached through the
    # private device VLAN (see SECURITY.md §"Biometric terminals"); no
    # unauthenticated plaintext path is opened to the public internet.
    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hrms.bsctextiles.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 minimum, 1.3 preferred. The cipher list is Mozilla's
    # "intermediate" set: forward secrecy everywhere, no CBC-mode SHA-1, no
    # static RSA key exchange.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling keeps certificate status checks off the client's critical path.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    limit_conn perip_conn 60;

    include /etc/nginx/snippets/security-headers.conf;

    # Reject obvious probes before they reach any upstream.
    location ~* /\.(git|env|htaccess|aws|ssh)|wp-|phpmyadmin|xmlrpc\.php {
      access_log off;
      return 404;
    }

    # -----------------------------------------------------------------------
    # Device push (eSSL / ZKTeco ADMS). Plain HTTP POSTs from the terminals,
    # which cannot present a browser origin — hence its own location.
    # -----------------------------------------------------------------------
    location /iclock/ {
      limit_req zone=perip_general burst=50 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      client_max_body_size 12m;
      proxy_read_timeout 120s;
    }

    # -----------------------------------------------------------------------
    # Auth endpoints — strictest limit, never cached. A 5/minute budget per IP
    # is what makes credential stuffing expensive; the application adds the
    # per-login-ID lockout on top.
    # -----------------------------------------------------------------------
    location ~ ^/api/(auth/)?session/(login|refresh|mfa|exchange|captcha)$ {
      limit_req zone=perip_auth burst=5 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      add_header Cache-Control "no-store, no-transform" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # API — never cached. Authenticated responses must not be storable by a
    # shared cache, so the proxy asserts that explicitly rather than relying
    # on the backend's headers alone.
    # -----------------------------------------------------------------------
    location /api/ {
      limit_req zone=perip_general burst=200 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      add_header Cache-Control "no-store, no-transform" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      proxy_read_timeout 120s;
    }

    # Socket.IO: polling upgrade plus streaming, unbuffered.
    location /socket.io/ {
      limit_req zone=perip_general burst=120 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Employee photos and uploaded documents. These are personal data: the
    # cache is private (never shared, never written to a CDN edge) and short.
    location /uploads/ {
      limit_req zone=perip_general burst=100 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1h;
      add_header Cache-Control "private, max-age=3600, no-transform" always;
    }

    # -----------------------------------------------------------------------
    # Immutable build assets. Next.js emits content-hashed filenames under
    # /_next/static, so these can be cached hard and for a year.
    # -----------------------------------------------------------------------
    location /_next/static/ {
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_web;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
    }

    location /images/ {
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_web;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
    }

    # -----------------------------------------------------------------------
    # Everything else is the Next.js app.
    # -----------------------------------------------------------------------
    location / {
      limit_req zone=perip_general burst=200 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      proxy_pass http://hrms_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }

  # Catch-all for a request with the wrong SNI/Host: no virtual-host disclosure.
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    return 444;
  }
}
