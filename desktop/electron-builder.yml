appId: com.bsctextiles.hrms
productName: BSC Textiles HRMS
electronVersion: 44.7.0
npmRebuild: false
copyright: Copyright © 2026 BSC Textiles Pvt Ltd. All rights reserved.

directories:
  output: ../dist-release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "BSC-Textiles-Setup-${version}.${ext}"
  legalTrademarks: BSC Textiles Pvt Ltd
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "BSC Textiles HRMS"
  uninstallDisplayName: "BSC Textiles HRMS — Enterprise Suite"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
